name: Test base-script.sh

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run base-script.sh test suite
        run: bash tests/test_base_script.sh

      - name: Shellcheck
        uses: ludeeus/action-shellcheck@master
        with:
          scandir: "."
          severity: warning
