name: Build and Test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install build tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq cmake build-essential

      - name: Configure
        run: cmake -B build .

      - name: Build
        run: cmake --build build

      - name: Verify the binary is statically linked
        run: file build/monitor | grep -q "statically linked"

      - name: Run tests
        run: ctest --test-dir build --output-on-failure
