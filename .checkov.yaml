# Checkov (IaC) no job security do CI (.github/workflows/ci.yml). Falha com
# qualquer achado. Os checks desligados abaixo são decisão (custo ou escopo de
# um ambiente de validação), não dívida: religar exige ADR.
directory:
  - infra/terraform
framework:
  - terraform
quiet: true
compact: true
skip-check:
  # Role de deploy do CI com AdministratorAccess: risco consciente, documentado
  # em infra/terraform/ci-github.tf (o Terraform gerencia IAM/VPC/EC2/CloudFront).
  - CKV_AWS_274
  # CloudFront: WAF, failover, geo-restrição e access logging por custo e porque
  # é um único origin de validação. TLS 1.2 mínimo exige certificado próprio
  # (domínio default *.cloudfront.net fixa TLSv1): resolve ao ligar domínio.
  - CKV_AWS_68
  - CKV2_AWS_47
  - CKV_AWS_310
  - CKV_AWS_374
  - CKV_AWS_86
  - CKV_AWS_174
  - CKV2_AWS_42
  # Chaves padrão da AWS (aws/ssm, aws/ebs, aws/sns, logs) em vez de CMK: CMK custa
  # US$ 1/mês cada e o state/secrets já são só da conta.
  - CKV_AWS_337
  - CKV_AWS_189
  - CKV_AWS_158
  # EC2: monitoramento detalhado (1 min) custa extra; CloudWatch Agent cobre o que importa.
  - CKV_AWS_126
  # SG: a regra de entrada usa a prefix list gerenciada do CloudFront, não 0.0.0.0/0.
  - CKV_AWS_260
  # S3 de backup: notificações de evento não se aplicam.
  - CKV2_AWS_62
  # S3 de backup: sem access logging, replicação cross-region nem KMS próprio
  # (SSE-S3 já cifra; ambiente único de validação, custo).
  - CKV_AWS_18
  - CKV_AWS_144
  - CKV_AWS_145
