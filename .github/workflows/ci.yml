# CI de pull request: testes + terraform plan (somente leitura, role OIDC
# runcodes-github-plan, ver infra/terraform/ci-github.tf) + segurança (gitleaks,
# npm audit, semgrep, checkov). O ruleset da main exige os três jobs verdes:
# `test`, `terraform-plan` e `security`.
#
# Actions fixadas por SHA (o repo exige: Actions > sha_pinning_required). Tag
# é mutável, SHA não. O Dependabot (ecossistema github-actions) atualiza o SHA
# e o comentário de versão ao lado.
name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  id-token: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: API (build + vitest)
        working-directory: api
        run: |
          npm ci
          npx prisma generate
          npm run build
          npm test

      - name: Web (lint + vitest + build)
        working-directory: web
        run: |
          npm ci
          npm run lint
          npm test
          npm run build

      - name: Docs (typecheck + build)
        working-directory: docs
        run: |
          npm ci
          npm run typecheck
          npm run build

      - name: Scripts de infra (plan-guard)
        run: node --test infra/scripts/*.test.mjs

      # uv baixa o Python 3.14 exigido pelo compiler (requires-python).
      - name: Compiler (ruff + unittest)
        working-directory: compiler
        run: |
          pip install --quiet uv==0.11.29
          uv sync --frozen
          uv run ruff check src
          # Só os unitários: tests/engine exigem Docker e as imagens de linguagem.
          PYTHONPATH=src:src/rcc/tests uv run python -m unittest \
            $(cd src/rcc/tests && ls test_*.py | sed 's/\.py$//')

  terraform-plan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # PR do Dependabot roda "como fork": só Dependabot secrets, e a emissão
      # do token OIDC nesse contexto não é garantida. Se a role de plan não
      # puder ser assumida num PR do Dependabot, o job não quebra: cai pra
      # fmt + validate sem backend e avisa. Para qualquer outro autor a falha
      # continua fatal.
      - name: Credenciais AWS (role de plan, somente leitura)
        id: aws
        continue-on-error: ${{ github.actor == 'dependabot[bot]' }}
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::220395825071:role/runcodes-github-plan
          aws-region: us-east-1

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.5.7
          terraform_wrapper: false

      - name: Terraform fmt
        run: terraform -chdir=infra/terraform fmt -check -recursive

      - name: Terraform init
        if: steps.aws.outcome == 'success'
        run: terraform -chdir=infra/terraform init -input=false

      - name: Terraform init (sem backend, PR do Dependabot sem AWS)
        if: steps.aws.outcome != 'success'
        run: |
          echo "::warning::Role de plan indisponivel neste PR do Dependabot; rodando so fmt + validate (sem plan)."
          terraform -chdir=infra/terraform init -input=false -backend=false

      - name: Terraform validate
        run: terraform -chdir=infra/terraform validate

      # -lock=false: plan de PR não segura o lock (a role de PR é read-only).
      - name: Terraform plan
        if: steps.aws.outcome == 'success'
        run: |
          terraform -chdir=infra/terraform plan -input=false -lock=false -no-color \
            | tail -n 80

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      # O gitleaks-action lista os commits do PR pela API (403 sem isto).
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # O gitleaks examina os commits do PR: precisa do histórico.
          fetch-depth: 0

      # Segredo em commit do PR bloqueia o merge. Falso positivo entra em
      # .gitleaksignore pelo fingerprint; a regra nunca é desligada. Credencial
      # que apareceu em commit é tratada como vazada e rotacionada.
      - name: Gitleaks (segredos nos commits do PR)
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      # Vulnerabilidade alta ou crítica em dependência que VAI para produção
      # bloqueia (api e web). Média e baixa ficam com o Dependabot. Advisory
      # sem correção upstream: `overrides` no package.json com justificativa em
      # docs de infra, nunca desligar o gate.
      - name: npm audit (dependências de produção)
        run: |
          npm --prefix api audit --omit=dev --audit-level=high
          # web: zod 3 -> 4 quebra os tipos do react-hook-form em ~12 telas
          # (GHSA-mrhx-c7xc-m3w5, DoS de memória só na aba do próprio usuário).
          # Gate em critical até a migração; ver CLAUDE.md, Achados.
          npm --prefix web audit --omit=dev --audit-level=critical

      # SAST. Achado ERROR ou WARNING falha. Exceção consciente leva
      # `// nosemgrep: <id da regra> -- motivo` na linha anterior.
      - name: Semgrep (SAST)
        run: |
          pip install --quiet semgrep==1.183.0
          semgrep scan --config p/typescript --config p/nodejs --config p/secrets --config p/dockerfile \
            --metrics=off --error \
            --exclude node_modules --exclude .claude --exclude '*.test.ts' --exclude e2e \
            --exclude 'docs/build' --exclude 'compiler-images' api web infra deploy

      # Só achado NOVO em relação a infra/terraform/.checkov.baseline falha.
      - name: Checkov (Terraform)
        uses: bridgecrewio/checkov-action@45edc9d8856b664db2ec251f5f8632361f0a67aa # v12.3139.0 (checkov 3.4.3)
        with:
          directory: infra/terraform
          config_file: .checkov.yaml
