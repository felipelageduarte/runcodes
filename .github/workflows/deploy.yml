# Deploy de produção: roda em todo push na main (merge de PR incluso) e sob
# demanda via workflow_dispatch. Usa a role OIDC runcodes-github-deploy (ver
# infra/terraform/ci-github.tf) e o MESMO script do deploy local
# (infra/scripts/deploy.sh), com --yes pra pular a confirmação interativa.
#
# Sequência (dentro do deploy.sh): terraform plan + plan-guard (recusa destruir
# host, dados, rede, borda ou IAM) -> apply -> SSM envia remote-deploy.sh à
# instância (build web/docs, imagens, docker compose up) -> health check público.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      allow_destructive:
        description: 'Permite plano que destrói/recria instância, volume de dados, VPC, CloudFront, buckets ou IAM (revise o plano antes)'
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

# Deploys enfileiram, nunca cancelam um apply no meio.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: API (build + vitest)
        working-directory: api
        run: |
          npm ci
          npx prisma generate
          npm run build
          npm test

      - name: Web (lint + vitest + build)
        working-directory: web
        run: |
          npm ci
          npm run lint
          npm test
          npm run build

      - name: Scripts de infra (plan-guard)
        run: node --test infra/scripts/

  deploy:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::220395825071:role/runcodes-github-deploy
          aws-region: us-east-1

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.5.7
          terraform_wrapper: false

      - name: Deploy (terraform + plan-guard + SSM + health check)
        env:
          ALLOW_DESTRUCTIVE: ${{ inputs.allow_destructive == true && 'true' || 'false' }}
          DEPLOY_SHA: ${{ github.sha }}
        run: ./infra/scripts/deploy.sh --yes
